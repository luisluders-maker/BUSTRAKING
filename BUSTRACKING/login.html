<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusTracking - Login</title>
</head>
<body>
    <header>
        <nav>
            BusTracking
        </nav>
    </header>

    <section>
        <aside>
            <div>
                    <button>Entrar</button>
                    <button>Criar Conta</button>
            </div>

            <div>
                <!-- Formulário de Login -->
                <form>
                    <label>E-mail</label>
                    <input type="email">

                    <label>Senha</label>
                    <input type="password">

                    <button>Entrar</button>
                </form>

            </div>

            <div>
                <!-- Formulário de Cadastro -->
                <form>
                    <label>Nome Completo</label>
                    <input type="text">

                    <label>E-mail</label>
                    <input type="email">

                    <label>Senha</label>
                    <input type="password">

                    <label>Confirmar Senha</label>
                    <input type="password">

                    <button>Criar Conta</button>
                </form>

            </div>
        </aside>
    </section>
    
</body>
</html>
